name: ecoruta
description: Reporte ciudadano de residuos con IA en el dispositivo.
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  image_picker: ^1.0.7
  google_mlkit_image_labeling: ^0.12.0
  geolocator: ^12.0.0
  flutter_secure_storage: ^9.0.0
flutter:
  uses-material-design: true
